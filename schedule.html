<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이너스뮤직 - 사회자 스케줄 현황</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Apple SD Gothic Neo','Noto Sans KR',Dotum,sans-serif;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  min-height: 100vh;
  color: #fff;
  padding: 20px 16px 40px;
}
.container { max-width: 640px; margin: 0 auto; }

/* 헤더 */
.header { text-align: center; padding: 32px 0 28px; }
.logo { font-size: 13px; letter-spacing: 3px; color: #a78bfa; font-weight: 600; margin-bottom: 10px; }
.title { font-size: 26px; font-weight: 700; color: #fff; margin-bottom: 8px; }
.subtitle { font-size: 13px; color: #94a3b8; line-height: 1.6; }

/* 날짜 선택 카드 */
.search-card {
  background: rgba(255,255,255,0.07);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 24px;
}
.search-label { font-size: 13px; color: #94a3b8; margin-bottom: 10px; font-weight: 600; letter-spacing: 0.5px; }
.search-row { display: flex; gap: 10px; }
.date-input {
  flex: 1;
  height: 48px;
  background: rgba(255,255,255,0.1);
  border: 1.5px solid rgba(255,255,255,0.15);
  border-radius: 10px;
  color: #fff;
  font-size: 16px;
  padding: 0 14px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s;
}
.date-input:focus { border-color: #a78bfa; }
.date-input::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.7; cursor: pointer; }
.search-btn {
  height: 48px;
  padding: 0 24px;
  background: linear-gradient(135deg, #7c3aed, #a78bfa);
  border: none;
  border-radius: 10px;
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: opacity 0.2s;
  white-space: nowrap;
}
.search-btn:hover { opacity: 0.85; }

/* 로딩 */
.loading { text-align: center; padding: 40px 0; color: #94a3b8; display: none; }
.spinner {
  width: 36px; height: 36px;
  border: 3px solid rgba(167,139,250,0.3);
  border-top-color: #a78bfa;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* 결과 영역 */
.result-area { display: none; }
.result-date {
  text-align: center;
  font-size: 18px;
  font-weight: 700;
  color: #e2e8f0;
  margin-bottom: 16px;
  padding: 12px;
  background: rgba(255,255,255,0.05);
  border-radius: 10px;
}
.result-date span { color: #a78bfa; }

/* 탭 */
.tabs { display: flex; gap: 8px; margin-bottom: 16px; }
.tab-btn {
  flex: 1;
  height: 48px;
  background: rgba(255,255,255,0.07);
  border: 1.5px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  color: #94a3b8;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s;
  line-height: 1.3;
}
.tab-btn.active {
  background: linear-gradient(135deg, #7c3aed, #a78bfa);
  border-color: transparent;
  color: #fff;
}
.tab-count {
  display: inline-block;
  background: rgba(255,255,255,0.25);
  border-radius: 10px;
  padding: 1px 6px;
  font-size: 10px;
  margin-left: 3px;
}
.tab-btn.active .tab-count { background: rgba(255,255,255,0.3); }

/* 탭 패널 */
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ===== 예약 현황 섹션 ===== */
.section-title {
  font-size: 12px;
  font-weight: 700;
  color: #64748b;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 10px;
  padding-left: 4px;
}

/* 스케줄 카드 */
.schedule-card {
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.schedule-card.assigned { border-color: rgba(239,68,68,0.4); background: rgba(239,68,68,0.08); }

.mc-avatar {
  width: 40px; height: 40px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 700;
  flex-shrink: 0;
}
.mc-avatar.assigned { background: linear-gradient(135deg, #dc2626, #ef4444); color: #fff; }
.mc-avatar.unassigned { background: rgba(148,163,184,0.2); color: #64748b; }

.schedule-info { flex: 1; min-width: 0; }
.mc-name-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.mc-name { font-size: 14px; font-weight: 700; color: #f1f5f9; }
.mc-name.unassigned-name { color: #64748b; font-style: italic; }
.badge-assigned { font-size: 10px; font-weight: 700; background: #dc2626; color: #fff; padding: 2px 7px; border-radius: 20px; }
.badge-free { font-size: 10px; font-weight: 700; background: rgba(148,163,184,0.2); color: #64748b; padding: 2px 7px; border-radius: 20px; }
.schedule-detail { font-size: 12px; color: #94a3b8; }
.schedule-time { color: #a78bfa; font-weight: 600; }

/* ===== 추천 사회자 슬라이딩 섹션 ===== */
.recommend-section {
  margin-top: 20px;
  padding-top: 18px;
  border-top: 1px solid rgba(255,255,255,0.08);
}
.recommend-title {
  font-size: 13px;
  font-weight: 700;
  color: #a78bfa;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.recommend-desc {
  font-size: 11px;
  color: #64748b;
  margin-bottom: 14px;
}

/* 슬라이더 */
.slider-wrap {
  position: relative;
  overflow: hidden;
}
.slider-track {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 8px;
  scrollbar-width: none;
}
.slider-track::-webkit-scrollbar { display: none; }

/* 추천 사회자 카드 */
.mc-card {
  flex-shrink: 0;
  width: 120px;
  scroll-snap-align: start;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
  display: block;
}
.mc-card:hover { border-color: rgba(167,139,250,0.5); background: rgba(167,139,250,0.1); transform: translateY(-2px); }
.mc-card-img {
  width: 100%;
  height: 130px;
  object-fit: cover;
  object-position: top;
  display: block;
  background: rgba(255,255,255,0.05);
}
.mc-card-img-placeholder {
  width: 100%;
  height: 130px;
  background: linear-gradient(135deg, rgba(124,58,237,0.3), rgba(167,139,250,0.2));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  font-weight: 700;
  color: #a78bfa;
}
.mc-card-body { padding: 10px 10px 12px; }
.mc-card-name { font-size: 13px; font-weight: 700; color: #f1f5f9; margin-bottom: 3px; }
.mc-card-tier {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 4px;
  display: inline-block;
}
.tier-premium { background: rgba(212,184,150,0.2); color: #d4b896; border: 1px solid rgba(212,184,150,0.3); }
.tier-best { background: rgba(91,181,162,0.2); color: #5BB5A2; border: 1px solid rgba(91,181,162,0.3); }
.tier-standard { background: rgba(148,163,184,0.15); color: #94a3b8; border: 1px solid rgba(148,163,184,0.2); }

/* 빈 상태 */
.empty-slot { text-align: center; padding: 28px 20px; color: #64748b; font-size: 13px; }
.empty-icon { font-size: 32px; margin-bottom: 8px; }

/* 안내 문구 */
.notice {
  background: rgba(167,139,250,0.08);
  border: 1px solid rgba(167,139,250,0.18);
  border-radius: 10px;
  padding: 12px 14px;
  font-size: 12px;
  color: #c4b5fd;
  line-height: 1.7;
  margin-top: 16px;
}

/* 에러 */
.error-msg { text-align: center; padding: 32px 20px; color: #f87171; font-size: 14px; display: none; }

/* 초기 안내 */
.intro { text-align: center; padding: 32px 20px; color: #64748b; }
.intro-icon { font-size: 48px; margin-bottom: 14px; }
.intro-text { font-size: 14px; line-height: 1.8; }

/* 슬라이더 화살표 */
.slider-nav {
  display: flex;
  justify-content: flex-end;
  gap: 6px;
  margin-bottom: 10px;
}
.slider-arrow {
  width: 28px; height: 28px;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 50%;
  color: #fff;
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
}
.slider-arrow:hover { background: rgba(167,139,250,0.3); }

.no-recommend {
  padding: 16px;
  text-align: center;
  color: #64748b;
  font-size: 12px;
  background: rgba(255,255,255,0.03);
  border-radius: 10px;
}

@media (max-width: 400px) {
  .tab-btn { font-size: 10px; }
  .tabs { gap: 5px; }
}
</style>
</head>
<body>
<div class="container">

  <!-- 헤더 -->
  <div class="header">
    <div class="logo">INUS MUSIC</div>
    <div class="title">사회자 스케줄 현황</div>
    <div class="subtitle">예식 날짜를 선택하면 해당 날짜에<br>배정된 사회자 현황을 확인할 수 있습니다.</div>
  </div>

  <!-- 날짜 검색 -->
  <div class="search-card">
    <div class="search-label">📅 예식 날짜 선택</div>
    <div class="search-row">
      <input type="date" class="date-input" id="dateInput" />
      <button class="search-btn" onclick="searchSchedule()">조회</button>

    <div class="spinner"></div>

      날짜를 선택하고 조회 버튼을 누르면<br>
      해당 날짜에 배정된 사회자 현황을<br>
      시간대별로 확인할 수 있습니다.

  <!-- 결과 -->
  <div class="result-area" id="resultArea">

    <div class="tabs">
      <button class="tab-btn active" id="tab-am" onclick="switchTab('am')">
        오전 11~2시<br><span class="tab-count" id="cnt-am">0</span>건

      <button class="tab-btn" id="tab-pm1" onclick="switchTab('pm1')">
        오후 2~4시<br><span class="tab-count" id="cnt-pm1">0</span>건

      <button class="tab-btn" id="tab-pm2" onclick="switchTab('pm2')">
        오후 4~7시<br><span class="tab-count" id="cnt-pm2">0</span>건
      </button>
    </div>

    <!-- 탭 패널 -->
    <div class="tab-panel active" id="panel-am"></div>
    <div class="tab-panel" id="panel-pm1"></div>
    <div class="tab-panel" id="panel-pm2"></div>

    <!-- 안내 -->
    <div class="notice">
      💡 <strong>빨간색으로 표시된 사회자</strong>는 해당 시간대에 이미 예약이 완료된 사회자입니다.<br>
      아래 추천 목록에서 가능한 사회자를 확인하고 문의해 주세요.
    </div>
  </div>

</div>

<script>
var API_URL = 'https://bnsmusics.godohosting.com/bns/admin/schedule_api.php';

// 사회자 프로필 데이터 (홈페이지와 동일)
var MC_PROFILES = [
  { name: '김민수',  tier: 'BEST',     img: 'https://www.inusmc.co.kr/images/mc-profile-1_33531819.jpg',         url: 'https://blog.naver.com/inusmusics/223996383838' },
  { name: '고승범',  tier: 'BEST',     img: 'https://www.inusmc.co.kr/images/mc-profile-4_a9e52880.jpg',         url: 'https://blog.naver.com/inusmusics/223235771542' },
  { name: '이도영',  tier: 'BEST',     img: 'https://www.inusmc.co.kr/images/mc-profile-2_f194877b.jpg',         url: 'https://blog.naver.com/inusmusics/223845891681' },
  { name: '석재선',  tier: 'PREMIUM',  img: 'https://www.inusmc.co.kr/images/mc-profile-3_33ff7a32.jpg',         url: 'https://blog.naver.com/inusmusics/223822182933' },
  { name: '이우영',  tier: 'PREMIUM',  img: 'https://www.inusmc.co.kr/images/mc-lee-wooyoung-new_fa27e84d.webp', url: 'https://www.inusmc.co.kr/profile-wooyoung.html' },
  { name: '김선혁',  tier: 'BEST',     img: 'https://www.inusmc.co.kr/images/host_sunhyuk_1ed704ab.jpg',         url: 'https://blog.naver.com/inusmusics/221025505211' },
  { name: '장윤태',  tier: 'PREMIUM',  img: 'https://files.manuscdn.com/user_upload_by_module/session_file/310519663604364385/YIRjIXsBhCqAiMgE.jpg', url: 'https://blog.naver.com/inusmusics/223246261228' },
  { name: '길상우',  tier: 'BEST',     img: 'https://www.inusmc.co.kr/images/mc-gilsangwoo.jpg',                 url: 'https://blog.naver.com/inusmusics/220802942529' },
  { name: '최윤아',  tier: 'PREMIUM',  img: '',                                                                   url: 'https://blog.naver.com/inusmusics/224327229799' },
  { name: '민준호',  tier: 'PREMIUM',  img: '',                                                                   url: 'https://www.inusmc.co.kr/' },
  { name: '심비성',  tier: 'STANDARD', img: '',                                                                   url: 'https://www.inusmc.co.kr/' },
  { name: '이도건',  tier: 'STANDARD', img: '',                                                                   url: 'https://www.inusmc.co.kr/' },
  { name: '김범태',  tier: 'STANDARD', img: '',                                                                   url: 'https://www.inusmc.co.kr/' },
  { name: '김태우',  tier: 'BEST',     img: '',                                                                   url: 'https://www.inusmc.co.kr/' },
  { name: '고승범',  tier: 'BEST',     img: 'https://www.inusmc.co.kr/images/mc-profile-4_a9e52880.jpg',         url: 'https://blog.naver.com/inusmusics/223235771542' },
  { name: '구한림',  tier: 'STANDARD', img: '',                                                                   url: 'https://www.inusmc.co.kr/' },
  { name: '김성환',  tier: 'STANDARD', img: '',                                                                   url: 'https://www.inusmc.co.kr/' },
  { name: '문학진',  tier: 'STANDARD', img: '',                                                                   url: 'https://www.inusmc.co.kr/' },
  { name: '박진영',  tier: 'STANDARD', img: '',                                                                   url: 'https://www.inusmc.co.kr/' },
  { name: '이우영',  tier: 'PREMIUM',  img: 'https://www.inusmc.co.kr/images/mc-lee-wooyoung-new_fa27e84d.webp', url: 'https://www.inusmc.co.kr/profile-wooyoung.html' },
  { name: '장윤태',  tier: 'PREMIUM',  img: 'https://files.manuscdn.com/user_upload_by_module/session_file/310519663604364385/YIRjIXsBhCqAiMgE.jpg', url: 'https://blog.naver.com/inusmusics/223246261228' },
  { name: '김한솔',  tier: 'STANDARD', img: '',                                                                   url: 'https://www.inusmc.co.kr/' },
  { name: '강동우',  tier: 'STANDARD', img: '',                                                                   url: 'https://www.inusmc.co.kr/' },
  { name: '김민중',  tier: 'STANDARD', img: '',                                                                   url: 'https://www.inusmc.co.kr/' },
  { name: '임원빈',  tier: 'STANDARD', img: '',                                                                   url: 'https://www.inusmc.co.kr/' },
];

// 전체 사회자 명단
var ALL_EMCEES = ['고승범','구한림','김민수','길상우','김범태','김선혁','김성환','문학진',
  '민준호','박진영','이우영','장윤태','석재선','이도영','이도건','심비성',
  '김태우','김한솔','강동우','김민중','최윤아','임원빈'];

// 오늘 날짜 기본값
(function() {
  var today = new Date();
  var y = today.getFullYear();
  var m = String(today.getMonth()+1).padStart(2,'0');
  var d = String(today.getDate()).padStart(2,'0');
  document.getElementById('dateInput').value = y+'-'+m+'-'+d;
})();

// 시간 텍스트 → 분 단위 숫자 변환
function parseTimeToMin(t) {
  var m = t.match(/(\d+)\s*시\s*(\d+)?/);
  if (m) {
    var h = parseInt(m[1]);
    var min = m[2] ? parseInt(m[2]) : 0;
    if (h >= 1 && h <= 7) h += 12;
    return h * 60 + min;
  }
  return 9999;
}

function searchSchedule() {
  var date = document.getElementById('dateInput').value;
  if (!date) { alert('날짜를 선택해주세요.'); return; }

  document.getElementById('intro').style.display = 'none';
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('errorMsg').style.display = 'none';
  document.getElementById('loading').style.display = 'block';

  fetch(API_URL + '?date=' + date)
    .then(function(r) { return r.json(); })
    .then(function(data) {
      document.getElementById('loading').style.display = 'none';
      if (data.code !== 1) {
        showError(data.message || '조회 실패');
        return;
      }
      renderResult(data);
    })
    .catch(function(e) {
      document.getElementById('loading').style.display = 'none';
      showError('서버 연결에 실패했습니다. 잠시 후 다시 시도해주세요.');
    });
}

function showError(msg) {
  var el = document.getElementById('errorMsg');
  el.textContent = '⚠️ ' + msg;
  el.style.display = 'block';
}

function formatDate(dateStr) {
  var d = new Date(dateStr + 'T00:00:00');
  var days = ['일','월','화','수','목','금','토'];
  return d.getFullYear() + '년 ' + (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + days[d.getDay()] + ')';
}

// 각 슬롯별로 배정된 사회자 목록 수집 (이름 → 시간 분 단위)
function getAssignedMap(slots) {
  var map = {}; // { 이름: [분, 분, ...] }
  var allSlots = ['am','pm1','pm2','other'];
  allSlots.forEach(function(k) {
    var items = slots[k] || [];
    items.forEach(function(item) {
      if (item.assigned && item.mc_name !== '미지정') {
        if (!map[item.mc_name]) map[item.mc_name] = [];
        map[item.mc_name].push(parseTimeToMin(item.time));
      }
    });
  });
  return map;
}

// 특정 시간대에 가능한 사회자 목록 (앞뒤 150분=2시간30분 이내 배정 없는 사람)
function getAvailableMcs(slotKey, assignedMap) {
  // 슬롯 대표 시간 범위
  var slotRanges = { am: [660, 840], pm1: [840, 960], pm2: [960, 1140] }; // 분 단위
  var range = slotRanges[slotKey] || [660, 840];
  var slotMid = (range[0] + range[1]) / 2;

  return ALL_EMCEES.filter(function(name) {
    var times = assignedMap[name] || [];
    // 이 슬롯 시간대 중간 기준 ±150분 이내에 배정 있으면 제외
    for (var i = 0; i < times.length; i++) {
      if (Math.abs(times[i] - slotMid) <= 150) return false;
    }
    return true;
  });
}

function getMcProfile(name) {
  for (var i = 0; i < MC_PROFILES.length; i++) {
    if (MC_PROFILES[i].name === name) return MC_PROFILES[i];
  }
  return { name: name, tier: 'STANDARD', img: '', url: 'https://www.inusmc.co.kr/' };
}

function renderMcCard(name) {
  var p = getMcProfile(name);
  var tierClass = p.tier === 'PREMIUM' ? 'tier-premium' : (p.tier === 'BEST' ? 'tier-best' : 'tier-standard');
  var imgHtml = p.img
    ? '<img class="mc-card-img" src="' + p.img + '" alt="' + name + '" onerror="this.style.display=\'none\';this.nextSibling.style.display=\'flex\'">' +
      '<div class="mc-card-img-placeholder" style="display:none">' + name.charAt(0) + '</div>'
    : '<div class="mc-card-img-placeholder">' + name.charAt(0) + '</div>';
  return '<a class="mc-card" href="' + p.url + '" target="_blank" rel="noopener">' +
    imgHtml +
    '<div class="mc-card-body">' +
    '<div class="mc-card-name">' + name + '</div>' +
    '<span class="mc-card-tier ' + tierClass + '">' + p.tier + '</span>' +
    '</div></a>';
}

function renderResult(data) {
  var slots = data.slots;
  var slotKeys = ['am','pm1','pm2'];

  // 날짜 표시
  document.getElementById('resultDate').innerHTML =
    '<span>' + formatDate(data.date) + '</span> 사회자 현황';

  // 전체 배정 맵 계산
  var assignedMap = getAssignedMap(slots);

  // 각 탭 렌더링
  slotKeys.forEach(function(key) {
    var items = slots[key] || [];
    document.getElementById('cnt-'+key).textContent = items.length;

    var panel = document.getElementById('panel-'+key);
    var html = '';

    // 예약 현황
    html += '<div class="section-title">📋 예약 현황</div>';
    if (items.length === 0) {
      html += '<div class="empty-slot"><div class="empty-icon">✅</div>이 시간대에 배정된 사회자가 없습니다.</div>';
    } else {
      items.forEach(function(item) {
        var isAssigned = item.assigned;
        var initial = isAssigned ? item.mc_name.charAt(0) : '?';
        html += '<div class="schedule-card ' + (isAssigned ? 'assigned' : 'unassigned') + '">';
        html += '<div class="mc-avatar ' + (isAssigned ? 'assigned' : 'unassigned') + '">' + initial + '</div>';
        html += '<div class="schedule-info">';
        html += '<div class="mc-name-row">';
        html += '<span class="mc-name' + (isAssigned ? '' : ' unassigned-name') + '">' + (isAssigned ? item.mc_name : '미지정') + '</span>';
        html += '<span class="' + (isAssigned ? 'badge-assigned' : 'badge-free') + '">' + (isAssigned ? '배정완료' : '미지정') + '</span>';
        html += '</div>';
        html += '<div class="schedule-detail"><span class="schedule-time">' + item.time + '</span> · ' + item.place + '</div>';
        html += '</div></div>';
      });
    }

    // 추천 사회자 슬라이딩
    var availableMcs = getAvailableMcs(key, assignedMap);
    html += '<div class="recommend-section">';
    html += '<div class="recommend-title">✨ 이 시간대 가능한 사회자</div>';
    html += '<div class="recommend-desc">앞뒤 2시간 30분 이내 다른 예식이 없는 사회자입니다.</div>';

    if (availableMcs.length === 0) {
      html += '<div class="no-recommend">이 시간대에 가능한 사회자가 없습니다.</div>';
    } else {
      html += '<div class="slider-track" id="slider-' + key + '">';
      availableMcs.forEach(function(name) {
        html += renderMcCard(name);
      });
      html += '</div>';
    }
    html += '</div>';

    panel.innerHTML = html;
  });

  document.getElementById('resultArea').style.display = 'block';
  switchTab('am');
}

function switchTab(key) {
  ['am','pm1','pm2'].forEach(function(k) {
    document.getElementById('tab-'+k).className = 'tab-btn' + (k===key?' active':'');
    document.getElementById('panel-'+k).className = 'tab-panel' + (k===key?' active':'');
  });
}

// Enter 키로 조회
document.getElementById('dateInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') searchSchedule();
});
</script>
